[project]
name = "prudence"
version = "0.1.0"
description = "GUI-first Microsoft Agent Framework harness backend"
readme = "README.md"
authors = [
    { name = "Steve Flowers", email = "steveflowers+github@fastmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agent-framework-foundry>=1.10.3,<2",
    "agent-framework-openai>=1.11.0,<2",
    "aiosqlite>=0.22.1",
    "azure-identity>=1.25.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
prudence = "maf_harness.main:main"
maf-harness-api = "maf_harness.main:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "maf_harness"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportUnusedFunction = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
